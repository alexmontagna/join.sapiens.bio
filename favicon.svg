<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- THE TAB FAVICON (2026-11-13, his words: «favicon 1 that is almost same
       thing of home icon (globe + leaf)»): the globe wearing the Garden leaf at
       its lower right, the way a face in the Garden wears it in the app. The
       home-screen icon is the same pair on walnut (scripts/gen-icons.mjs).

       THE GLOBE is GlobeIcon.jsx's own sphere, land and gleam
       (GLOBE_SPHERE / GLOBE_LAND / GLOBE_GLEAM), scaled ×4.5062 from its 20-unit
       box, so it fills about 15 of a tab's 16 pixels; the brass stand stays home.
       Parchment #ebd0a0, land #b97f2b, a rim of #875814 at 45%, one radial wash
       lit from the upper left (#gs), as in the app.

       THE LEAF is SapiensLogo.jsx's blade alone (LEAF_BLADE, with the shade lobe
       and the midrib of SapiensLeafBlade), scaled ×1.62, its tip in the corner.
       No stalk: at 16px it cut a notch into the globe's lower edge. The globe is
       cut 2.7 units clear around the blade (#cv), the seat the app cuts round
       the leaf on a face, so the two never touch at any size.

       ⚠️ COLOURS LIVE ON THE ELEMENTS, NOT IN THE STYLESHEET. A favicon is
       rasterised by strangers: Facebook, Slack, iMessage and feed readers all
       run their own SVG renderer, and those renderers routinely ignore <style>
       blocks and modern colour functions. A dropped fill falls back to the CSS
       initial value, black: that is what shipped to Facebook's link previews
       until 2026-08-20. Presentation attributes need no CSS engine.

       The <style> block is therefore an ENHANCEMENT only: on a dark tab the
       leaf takes the lighter garden green (#4cc06b / #199947), keyed off the OS
       scheme, the one a tab bar follows; a renderer that skips it keeps the
       light greens (#099341 / #006e1c, base.css's green tokens in sRGB). -->
  <style>
    @media (prefers-color-scheme: dark) {
      .blade { fill: #4cc06b; }
      .shade { fill-opacity: 0.16; }
      .rib { stroke: #199947; }
    }
  </style>
